<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="../../js/theme-init.js"></script>

  <!-- These tags are boilerplate scaffolding filled in from content.md's frontmatter when the
       post is created (by /new-post). They exist so search engines and crawlers that do not
       execute JavaScript still see a correct title/description/author/date for this post.
       The article BODY below is always rendered client-side from content.md by post-render.js —
       never edit this file's content to match prose changes; edit content.md and re-run
       /publish-post to keep these tags in sync. -->
  <title>{{TITLE}}</title>
  <meta name="description" content="{{SUMMARY}}">
  <link rel="canonical" href="https://apbeers.github.io/blog/posts/{{SLUG}}/index.html">

  <meta property="og:type" content="article">
  <meta property="og:title" content="{{TITLE}}">
  <meta property="og:description" content="{{SUMMARY}}">
  <meta property="og:url" content="https://apbeers.github.io/blog/posts/{{SLUG}}/index.html">
  <meta property="article:published_time" content="{{DATE}}">
  <meta property="article:author" content="{{AUTHOR_NAME}}">
  <meta name="twitter:card" content="summary">

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting",
    "headline": "{{TITLE}}",
    "description": "{{SUMMARY}}",
    "datePublished": "{{DATE}}",
    "author": { "@type": "Person", "name": "{{AUTHOR_NAME}}" }
  }
  </script>

  <link rel="stylesheet" href="../../css/variables.css">
  <link rel="stylesheet" href="../../css/reset.css">
  <link rel="stylesheet" href="../../css/typography.css">
  <link rel="stylesheet" href="../../css/layout.css">
  <link rel="stylesheet" href="../../css/components.css">
  <link rel="stylesheet" href="../../css/post.css">
</head>
<body data-root="../../">
  <div data-include="header"></div>

  <div class="article-header">
    <div class="article-header__category"><span id="post-category" class="pill"></span></div>
    <h1 id="post-title" class="article-header__title"></h1>
    <div id="post-byline" class="byline"></div>
  </div>

  <main class="container article-layout">
    <aside id="post-toc" class="article-toc">
      <div class="toc__title">On this page</div>
      <nav id="post-toc-list" class="toc__list"></nav>
    </aside>

    <article class="article-main">
      <div id="post-content" class="prose">
        <p class="state-message">Loading&hellip;</p>
      </div>
      <p style="margin-top: 40px;">
        <a class="button-link" href="../../index.html">&larr; All posts</a>
      </p>
    </article>
  </main>

  <div data-include="footer"></div>

  <script src="../../js/include-partials.js"></script>
  <script src="../../js/theme-toggle.js"></script>
  <script src="../../js/frontmatter.js"></script>
  <script src="../../js/markdown.js"></script>
  <script src="../../js/post-render.js"></script>
</body>
</html>
