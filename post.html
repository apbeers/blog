<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="js/theme-init.js"></script>

  <!-- This is the single shared page every post is viewed through, e.g.
       post.html?category=milestone&slug=2026-08-30-welcome-to-the-blog
       There is no per-post HTML file. js/post-render.js reads the category/slug
       from the URL, fetches posts/<category>/<slug>.md, and fills in everything
       below -- including the <title>/<meta>/OG/JSON-LD tags in this <head> -- at
       runtime. That means a crawler that does not execute JavaScript will only
       ever see the generic defaults here, not the specific post's metadata; one
       that does execute JavaScript (Google's indexer does) sees the real thing. -->
  <title>Blog</title>
  <meta name="description" content="Notes and writing, published as hand-written Markdown.">
  <link id="meta-canonical" rel="canonical" href="https://apbeers.github.io/blog/post.html">

  <meta id="meta-og-type" property="og:type" content="article">
  <meta id="meta-og-title" property="og:title" content="Blog">
  <meta id="meta-og-description" property="og:description" content="Notes and writing, published as hand-written Markdown.">
  <meta id="meta-og-url" property="og:url" content="https://apbeers.github.io/blog/post.html">
  <meta id="meta-article-published" property="article:published_time" content="">
  <meta id="meta-article-author" property="article:author" content="">
  <meta name="twitter:card" content="summary">

  <script id="meta-ld-json" type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "BlogPosting"
  }
  </script>

  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/typography.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/post.css">
</head>
<body data-root="">
  <div data-include="header"></div>

  <div id="mobile-toc" class="mobile-toc">
    <button id="mobile-toc-toggle" class="mobile-toc__toggle" type="button" aria-expanded="false" aria-controls="mobile-toc-list">
      <span id="mobile-toc-current" class="mobile-toc__current">On this page</span>
      <svg class="mobile-toc__chevron" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
        <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
    <nav id="mobile-toc-list" class="toc__list mobile-toc__list"></nav>
  </div>

  <main class="container article-layout">
    <aside id="post-toc" class="article-toc">
      <div id="post-toc-title" class="toc__title">On this page</div>
      <nav id="post-toc-list" class="toc__list"></nav>
    </aside>

    <article class="article-main">
      <div class="article-header">
        <div class="article-header__category"><span id="post-category" class="pill"></span></div>
        <h1 id="post-title" class="article-header__title"></h1>
        <div id="post-byline" class="byline"></div>
      </div>

      <div id="post-content" class="prose">
        <p class="state-message">Loading&hellip;</p>
      </div>
      <p style="margin-top: 40px;">
        <a class="button-link" href="index.html">&larr; All posts</a>
      </p>
    </article>
  </main>

  <div data-include="footer"></div>

  <script src="js/dev-server-notice.js"></script>
  <script src="js/include-partials.js"></script>
  <script src="js/sticky-header.js"></script>
  <script src="js/theme-toggle.js"></script>
  <script src="js/frontmatter.js"></script>
  <script src="js/markdown.js"></script>
  <script src="js/post-render.js"></script>
</body>
</html>
